schema_version: 1
rule_version: 1.0
status: stable

id: layout-brace-style
title: "Brace Style"
domain: layout

severity_default: minor
severity_rationale: |
  JRENG-CODING-STANDARD.md specifies K&R variant with opening brace on
  new line. Minor severity because violations are formatting only.
confidence_floor: medium
tags:
  - layout
  - formatting
depends_on: []

description: |
  Opening braces must appear on a new line. JRENG mandates:
  `if (x == 0)\n{\n    foobar();\n}` — NOT `if (x == 0) {`.
  This applies to all control structures, classes, and functions.
rationale: |
  JRENG §14-27 specifies: "Always place opening braces on a new line."
  This style improves readability by visually separating the condition
  from the body. It also makes the scope boundary visually clear.

evidence_pattern: |
  Pattern: `{` appearing on the same line as `if`, `for`, `while`,
  `do`, `class`, `struct`, or function signature.

examples:
  bad:
    - code: |
        if (x == 0) {
            foobar();
        }
  good:
    - code: |
        if (x == 0)
        {
            foobar();
        }

source_refs:
  - "contracts/JRENG-CODING-STANDARD.md"

